# Data Dragon versions, champions, items, runes and summoner spells, written
# into agg/v1/static/<ddragon_version>/. Daily, and before the site build, so
# that a new patch's static data is on disk before anything renders it.
#
# TODO(plan section 5.2, `static-sync`): the scaffold's ingest binary implements
# worker, discover-seeds, backfill and maintain only, so this subcommand exits 2
# with a usage message. The manifest is written as intended rather than omitted
# because the schedule, the resources and the egress rule are the parts that are
# hard to add later; when the subcommand lands, this CronJob starts working with
# no manifest change.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: static-sync
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: static-sync
spec:
  schedule: "10 3 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lolstats
            app.kubernetes.io/component: static-sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: static-sync
              # TODO(plan section 10, Phase 1): pin to a digest once a tag exists.
              image: ghcr.io/erik-schuetze/league-of-legends:latest
              command: ["/lolstats-ingest"]
              args: ["static-sync"]
              envFrom:
                - configMapRef:
                    name: lolstats-config
              env:
                - name: GOMEMLIMIT
                  value: 128MiB
                # Static data comes from Data Dragon over HTTPS, so this job is
                # the reason the egress rule for ddragon.leagueoflegends.com
                # exists. It needs no database.
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: data
                  mountPath: /var/lib/lolstats
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: lolstats-data
            - name: tmp
              emptyDir: {}
