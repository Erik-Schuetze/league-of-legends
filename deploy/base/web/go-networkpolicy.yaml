# The way in for the Go web tier, which the existing allow-web-ingress does not
# cover: that rule selects `component: web`, and this tier is `component: web-go`
# so that the two Services never select each other's pods (go-service.yaml).
#
# Two sources, and both are named rather than implied:
#
#   * namespace `web`, which is the shared Caddy. Nothing points at this tier yet
#     - the rule is here so that the switch (a selector edit on the live
#     `lolstats-web` Service) does not also need a network change made in the
#     same window, which is how a cutover grows a second failure mode.
#   * the pod CIDR, which is the same peer set the namespace already uses for the
#     in-namespace case (see allow-namespace-egress, which documents it at
#     length). Here it is what makes the tier reachable from a pod in this
#     namespace and from a `kubectl port-forward`, where the connection is made
#     on the node rather than from a pod address. Without it the verification
#     probe would need a policy change of its own, and a probe that changes the
#     thing it measures is not a probe.
#
# Both ports are listed because a CNI may evaluate the rule before or after
# service DNAT, exactly as allow-web-ingress does for the static tier.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-go-web-ingress
  labels:
    app.kubernetes.io/name: lolstats
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web-go
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: web
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
