# The read-only serving tier. Two replicas because this is the only component
# with a public URL, and a rolling restart of one leaves the other answering -
# the shared Caddy in front of it has no retry logic of its own.
#
# It mounts the data volume read-only: the site build writes it, this only ever
# reads it. The reverse direction would mean a path traversal in the file server
# could edit the published archive.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolstats-web
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lolstats
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lolstats
        app.kubernetes.io/component: web
      annotations:
        # Restarting on a Caddyfile change means a ConfigMap edit rolls the tier
        # out on its own, which is the difference between a config change and a
        # config change that only took effect after someone noticed.
        lolstats.dev/caddyfile-revision: "2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          # TODO(plan section 10, Phase 1): built by
          # .github/workflows/build-caddy-image.yml once the first tag exists.
          # Pin it as v<semver>@sha256:<digest> at the same time as the Go image.
          image: ghcr.io/erik-schuetze/league-of-legends-caddy:latest
          args:
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            # The smallest allocation in the stack. A file server with an
            # in-memory response cache for a site whose pages are a few
            # kilobytes does not need more, and the node is shared.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Caddy rewrites its state under $XDG_CONFIG_HOME and $XDG_DATA_HOME
            # when it loads a config, so those two paths are emptyDir mounts
            # below and everything else can stay immutable.
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: data
              mountPath: /var/lib/lolstats
              readOnly: true
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              # Not the site root: an unpublished site is a 404, and httpGet
              # treats 404 as a failure, which would hold both replicas out of
              # the Service for as long as the nightly build has not run once.
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: lol.erik-schuetze.dev
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: lol.erik-schuetze.dev
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: caddyfile
          configMap:
            name: lolstats-site-config
        - name: data
          persistentVolumeClaim:
            claimName: lolstats-data
        - name: config
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
