# ClusterIP only: the control plane is never reachable from outside the
# namespace, and the default-deny NetworkPolicy narrows it further.
apiVersion: v1
kind: Service
metadata:
  name: lolstats-postgres
  labels:
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
