# The server-rendered web tier: the same pages as the static site, assembled per
# request from the published aggregate snapshot.
#
# It is a second Deployment rather than a replacement, on purpose. The live
# `lolstats-web` Service still points at the static tier, and this one has its own
# Service (go-service.yaml) that nothing routes to yet, so both can be probed
# side by side and the switch is a selector edit made once, after parity is
# proven. Running both also means the comparison can be made against the same
# snapshot at the same time rather than against a screenshot.
#
# Two replicas for the same reason the static tier has two: this is the only
# component with a public URL, and a rolling restart of one leaves the other
# answering. maxUnavailable 0 keeps that true during a rollout; /readyz is a
# real data check, so a pod that cannot read the snapshot is held out of the
# Service instead of taking half the traffic and answering 503.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolstats-go-web
  annotations:
    # The image this tier is pinned to, consumed by the overlay's `replacements`
    # block: the deployment tree pins one repository for three binaries, and
    # kustomize's `images` transformer therefore cannot pin this one alone.
    # sha-6ede914: fixtures off for this tier, /about read out of the snapshot
    # instead of carrying the demo build's figures as prose, and the published
    # champion count taken from the cells the snapshot publishes rather than
    # from the length of its champion index.
    lolstats.dev/pinned-image: ghcr.io/erik-schuetze/league-of-legends@sha256:d4e136ddda522238ddc1976afb713173b4c7a1a576a80f28edf3a0e150555f5f
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: web-go
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lolstats
      app.kubernetes.io/component: web-go
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lolstats
        app.kubernetes.io/component: web-go
    spec:
      # Longer than the process's 15s shutdown grace (cmd/lolstats-web), so the
      # listener drains and finishes the responses in flight rather than being
      # killed mid-write.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # The distroless `nonroot` uid the image declares, same as the ingest
        # worker: the volume is mounted read-only and every file in it is
        # world-readable, so this needs no ownership of anything.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # The same image as the rest of the stack; this binary differs only in
          # where `command` points. Pin is in overlays/homelab/kustomization.yaml.
          image: ghcr.io/erik-schuetze/league-of-legends:latest
          # The image's ENTRYPOINT is /lolstats-ingest, so the tier is chosen
          # here. An explicit absolute path, not a subcommand: this binary has
          # none, and a typo is a start-up failure rather than a worker that
          # quietly crawls instead of serving.
          command: ["/lolstats-web"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            # LOLSTATS_AGG_ROOT, LOLSTATS_SITE_URL and LOLSTATS_METRICS_ADDR
            # come from here, and so does LOLSTATS_AGG_FIXTURES - with the
            # value the *old static tier* still needs ("only", the labelled
            # preview). That switch is deliberately global until the cutover,
            # because deploy/base/config.yaml is shared by both tiers and the
            # static tier stays up as the fallback until the Go tier is proven
            # in front of the public URL. The override below is what makes
            # *this* container read the real snapshot in the meantime.
            - configMapRef:
                name: lolstats-config
          env:
            # The fixtures tree is off for this tier, and `off` rather than
            # `auto` on purpose.
            #
            # `auto` falls back to the checked-in demo tree whenever the
            # configured root has no manifest, which is the silent
            # substitution the design forbids: a visitor would be shown
            # illustrative figures by a tier whose job is to publish the
            # snapshot. `off` means "render LOLSTATS_AGG_ROOT or answer with a
            # visible 503" - the artifact tree is published (agg/v1, source
            # riot-match-v5), so a missing or corrupt artifact is a fault and
            # has to be loud, never a demo page wearing a live banner.
            #
            # An explicit env entry takes precedence over envFrom, so this
            # overrides the ConfigMap's "only" for this container alone and the
            # static tier keeps rendering the preview it is deployed with.
            # The fixtures tree stays where it is: the tests and a local
            # `go run` still read it (internal/webtier/artifacts.go).
            - name: LOLSTATS_AGG_FIXTURES
              value: "off"
            - name: LOLSTATS_WEB_ADDR
              value: ":8080"
            # Where the demo tree is inside this image (the Dockerfile copies
            # it to this path). Named explicitly rather than discovered: the
            # discovery walk up from the working directory is a development
            # convenience, and in a container it would be a guess about the cwd.
            #
            # A missing directory here is a startup warning and a 503 on the
            # ladder pages, never a table with missing rows. The Data Dragon
            # projection the champion pages name items, runes and spells from
            # needs no path: it is embedded in the binary
            # (internal/webtier/data.go), with a test that fails if the copy in
            # web/src/data ever drifts from it.
            - name: LOLSTATS_FIXTURES_DIR
              value: /web/src/fixtures
            # Under the 384Mi limit below with room for the runtime and the
            # per-request page buffers, which are not heap the limit measures.
            # The file cache has its own bound (64MiB, internal/webtier/artifacts.go).
            - name: GOMEMLIMIT
              value: 224MiB
          resources:
            # Rendering is CPU-bound and bursty, and the process keeps only the
            # snapshot's newest partitions resident, so the reservation is small
            # relative to the limit. This is the second-smallest allocation in
            # the stack, after the Caddy file server.
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            # PodSecurity `restricted` in full: no privilege escalation, every
            # capability dropped, no writable root filesystem. The tier writes
            # nothing anywhere - it has no state, no cache directory and no
            # temp files - so a write attempt failing is the correct outcome and
            # is also what makes a path traversal in the artifact reader
            # useless.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/lolstats
              readOnly: true
            # The read-only root filesystem leaves no writable path at all, and
            # GOTRACEBACK-style diagnostics and any future temp file expect one.
            # An emptyDir here keeps that failure local instead of turning into
            # an unexplained crash under a read-only /.
            - name: tmp
              mountPath: /tmp
          # Readiness is the data check, not a liveness check with a different
          # name: /readyz answers 503 when the manifest advertises a newest
          # partition whose tierlist.json cannot be read, which is the failure
          # that takes the ladder pages down, so a pod in that state is kept out
          # of the Service while the other replica keeps serving. It answers 200
          # for a volume with no manifest at all, deliberately: the site pages
          # (/, /about, /legal/*) are real without a snapshot and a tier that
          # has never seen one is not failing - the ladder routes answer 503 per
          # request in that state (internal/webtier/server.go, /readyz).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness is about the process. It stays on /healthz deliberately: a
          # pod that has lost the volume can still serve the pages that do not
          # need it, and restarting it would not bring the artifact back.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          # The process compiles its templates at start-up and resolves the
          # snapshot before it listens, so the first seconds are busy and the
          # probe would otherwise race them.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lolstats-data
        - name: tmp
          emptyDir: {}
