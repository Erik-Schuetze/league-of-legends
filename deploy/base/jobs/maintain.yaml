# Compaction, retention and source-toggle bookkeeping. Hourly at :20 for two
# reasons: it keeps the raw tree from accumulating small parts for a whole day,
# and the offset from the hour means it does not contend with the other cron
# jobs in the homelab that mostly fire at :00.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maintain
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: maintain
spec:
  schedule: "20 * * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 43200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lolstats
            app.kubernetes.io/component: maintain
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # A pod that was just created cannot open its first TCP connection to
          # postgres for up to a second: the dial is refused outright while the
          # pod network namespace is still warming up (DNS answers in the same
          # instant, and a second dial milliseconds later succeeds). The store
          # connects fail-fast and never retries, so `maintain` - which needs the
          # connection before it does anything else - died on that first dial,
          # and a Job pod cannot recover the way the ingest Deployment does:
          # restartPolicy: Never forbids restarting the container inside the
          # already-warm pod namespace that the retry would have needed. This
          # gate therefore tries the connection until postgres answers, so the
          # app only starts once the refused-window is behind it. The 120s budget
          # and a one-second retry are both far inside the Job's own
          # activeDeadlineSeconds and backoffLimit, which stay unchanged.
          initContainers:
            - name: wait-for-postgres
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              command:
                - sh
                - -c
                - |
                  set -eu
                  if [ -z "${LOLSTATS_POSTGRES_DSN:-}" ]; then
                      echo "wait-for-postgres: LOLSTATS_POSTGRES_DSN is empty" >&2
                      exit 1
                  fi
                  authority=${LOLSTATS_POSTGRES_DSN##*@}
                  authority=${authority%%/*}
                  host=${authority%%:*}
                  port=${authority##*:}
                  deadline=$(( $(date +%s) + 120 ))
                  until nc -z -w 2 "$host" "$port"; do
                      if [ "$(date +%s)" -ge "$deadline" ]; then
                          echo "wait-for-postgres: ${host}:${port} did not accept a connection" >&2
                          exit 1
                      fi
                      echo "wait-for-postgres: retrying ${host}:${port}"
                      sleep 1
                  done
                  echo "wait-for-postgres: ${host}:${port} is accepting connections"
              env:
                - name: LOLSTATS_POSTGRES_DSN
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-postgres
                      key: DSN
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          containers:
            - name: maintain
              # TODO: pin to a digest with the other
              # workloads once a tag exists.
              image: ghcr.io/erik-schuetze/league-of-legends:latest
              command: ["/lolstats-ingest"]
              args: ["maintain"]
              envFrom:
                - configMapRef:
                    name: lolstats-config
              env:
                - name: GOMEMLIMIT
                  value: 256MiB
                # The DSN is required and the key is not: maintenance works on
                # the archive directly, but it also records what it did in
                # build_runs, and `runMaintain` refuses to start without a
                # database connection. It has no business calling Riot, so it
                # does not get a key even when one exists.
                - name: LOLSTATS_POSTGRES_DSN
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-postgres
                      key: DSN
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: data
                  mountPath: /var/lib/lolstats
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: lolstats-data
            - name: tmp
              emptyDir: {}
