# Renders the Astro site over the published aggregates into the site/ tree that
# the web tier serves. It is the only workload that runs the Node image and the
# only writer of site/.
#
# 03:40, after static-sync (03:10), because a page that reads static data must
# not render against yesterday's Data Dragon version.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: site-build
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: site-build
spec:
  schedule: "40 3 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lolstats
            app.kubernetes.io/component: site-build
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # The uid of the node user in the site image. The site tree has one
            # writer, so it does not have to agree with the Go workloads' uid.
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: site-build
              # TODO(plan section 10, Phase 1): pin to a digest once a tag exists.
              image: ghcr.io/erik-schuetze/league-of-legends-site:latest
              workingDir: /site
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  # Build first, publish second. Publishing is a rename of a
                  # complete directory onto the path the web tier reads, so a
                  # request can never land in a half-rendered tree and a failed
                  # build leaves the previous one serving.
                  npm run build

                  staging=/var/lib/lolstats/.site-staging
                  previous=/var/lib/lolstats/.site-previous
                  rm -rf "$staging" "$previous"
                  # -R, not -a: the only thing -a adds over -R here is ownership
                  # and symlink preservation, and the tree has no symlinks.
                  # Preserving ownership needs root, which runAsNonRoot forbids,
                  # and the NFS export root-squashes anyway, so `cp -a` prints
                  # "can't preserve ownership" and proceeds only because it
                  # chooses to tolerate that error. Under `set -eu` that is a
                  # tolerated error standing between a good build and a stale
                  # site, so ask for the copy that can actually succeed and then
                  # make the result readable no matter the image's umask.
                  # The web tier reads this tree as uid 1000.
                  cp -R /site/dist "$staging"
                  chmod -R a+rX "$staging"
                  if [ -d /var/lib/lolstats/site ]; then
                    mv /var/lib/lolstats/site "$previous"
                  fi
                  mv "$staging" /var/lib/lolstats/site
                  rm -rf "$previous"
              envFrom:
                - configMapRef:
                    name: lolstats-config
              env:
                # Astro reads the aggregate tree from LOLSTATS_AGG_ROOT, which
                # is the same variable the Go binaries use, so the layout has one
                # definition rather than one per language. It arrives through
                # envFrom above; this is the note that says so.
                #
                # Node sizes its heap from the host's total memory, not from the
                # container limit, so without this a large patch would make the
                # build grow until the kernel kills it.
                - name: NODE_OPTIONS
                  value: --max-old-space-size=512
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                # Unlike every other workload here, this one is not read-only:
                # Astro and Vite write caches inside the project directory
                # (node_modules/.vite, .astro), and a read-only root would fail
                # the build rather than harden anything that matters on a job
                # whose filesystem is discarded when it exits.
                readOnlyRootFilesystem: false
              volumeMounts:
                - name: data
                  mountPath: /var/lib/lolstats
                # Astro writes its cache and the rendered output under the
                # project directory; both stay ephemeral, only the published
                # copy reaches the volume.
                - name: site-cache
                  mountPath: /site/.astro
                - name: site-dist
                  mountPath: /site/dist
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: lolstats-data
            - name: site-cache
              emptyDir: {}
            - name: site-dist
              emptyDir: {}
            - name: tmp
              emptyDir: {}
