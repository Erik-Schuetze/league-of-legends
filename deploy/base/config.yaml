# The non-secret half of the runtime configuration. internal/config reads every
# setting from the environment and treats a Kubernetes ConfigMap as the natural
# source, so this map is projected into every lolstats pod with envFrom and no
# value is ever baked into an image.
#
# Secrets are deliberately absent: they come from Secrets referenced by name
# only (see deploy/README.md). Anything credential-shaped - the Riot key, the
# Postgres DSN - is injected per workload, never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lolstats-config
data:
  LOLSTATS_ENV: "prod"
  LOLSTATS_LOG_LEVEL: "info"
  LOLSTATS_LOG_FORMAT: "json"

  # One metrics port for every Go workload, and the port the ServiceMonitor in
  # homecluster/monitoring/servicemonitors scrapes.
  LOLSTATS_METRICS_ADDR: ":9090"

  # EUW is the only region v1 ingests. The region is a path element in every
  # artifact, so it is configuration rather than a constant.
  LOLSTATS_RIOT_REGION: "EUW"
  LOLSTATS_RIOT_PLATFORM_ROUTE: "euw1"
  LOLSTATS_RIOT_REGIONAL_ROUTE: "europe"

  # How long Riot is allowed to take before a call is called dead. The 10s
  # default was set for a match summary of about 100 KB, and it is too short for
  # the retry the same API asks for: a key at its rate limit answers 429 with
  # Retry-After, and this key has returned 15-16s while the crawler was keeping
  # up and 34s while it was behind. A client whose whole call has to finish
  # inside 10s cannot pay either, so it releases the retry and fails the row -
  # which is exactly what the live ingest Deployment logged, pass after pass:
  #   "retry-after outlasts the call's own deadline; the call is released"
  #   retry_after=15s deadline=10s
  #
  # 45s covers the largest Retry-After measured here (34s) with room for the
  # request itself. It is deliberately a ConfigMap value and not a flag: this is
  # the one lever that reaches the image already running, so the deployed
  # pipeline can pay Riot's Retry-After without waiting for a new build.
  #
  # Measured with the deployed `latest` image: a 20-match re-fetch with this
  # value set fetched 20/20, 0 failed, having paid a 16s and a 9s Retry-After
  # mid-run; with the 10s default the same call is released at the deadline.
  #
  # The retry-budget fix in internal/riot (RetryWaitBudget, 60s) bounds the
  # *waiting* rather than the whole call, and it reads this value as the
  # one-round-trip bound, so the two are additive: 45s + 60s has to stay inside
  # the fetch's own timeout, which is why the worker is started with
  # -job-timeout 120s in ingest/deployment.yaml.
  LOLSTATS_RIOT_TIMEOUT: "45s"

  # Both trees live on the one ReadWriteMany volume mounted at
  # /var/lib/lolstats, which is where the crawler writes raw payloads and the
  # nightly aggregate job writes its published snapshots. Keeping the roots here
  # means no manifest has to guess a path.
  LOLSTATS_RAW_ROOT: "/var/lib/lolstats/raw"
  LOLSTATS_AGG_ROOT: "/var/lib/lolstats/agg"

  # The public origin of the site. It is declared here rather than left to a
  # default in code so that the hostname this project publishes is visible in
  # the deployed configuration rather than implicit. Since the web tier was
  # retired (docs/decisions/ADR-011) nothing in the cluster serves it: the value
  # is the origin the released artifacts describe themselves as living at, and it
  # is what a future serving workload should read instead of hardcoding it.
  LOLSTATS_SITE_URL: "https://lol.erik-schuetze.dev"

  # The DuckDB resource bounds the nightly aggregate Job runs under. They are
  # declared here because the value that matters is the one the deployed pod
  # gets: DuckDB sizes its own default memory limit from the *host's* RAM, so a
  # pod with no explicit limit is a pod that believes it has the whole node and
  # gets OOM-killed against the 3 Gi limit in jobs/aggregate.yaml.
  #
  # 2GiB is two thirds of that 3 Gi limit, and the split is measured rather than
  # guessed. Over the live archive the extraction's heaviest statement - one
  # batch's features COPY, whose projection carries the rune-style list - fails
  # at a 1GiB limit with "Out of Memory Error: failed to allocate data of size
  # 2.0 MiB (1023.7 MiB/1.0 GiB used)" and completes at 1.5GiB, and the whole
  # 26-batch extraction completes at 1.5GiB and at 2GiB inside the Job's 3Gi
  # limit. The remaining third is the Go runtime (GOMEMLIMIT), the page cache and
  # DuckDB's non-buffer allocations - a limit equal to the pod limit is still a
  # kill. Raising this further is a decision about the pod's memory limit, not a
  # tweak; internal/aggregate asserts the pair
  # (engine_bounds_test.go::TestDuckDBDefaultsFitInsideThePodLimit).
  LOLSTATS_AGG_DUCKDB_MEMORY_LIMIT: "2GiB"
  # Matches the Job's 2-CPU limit. Unset, DuckDB takes the node's core count
  # (10 on the measured node) and every extra thread carries its own state.
  LOLSTATS_AGG_DUCKDB_THREADS: "2"
  # Where a statement spills when it does not fit in the limit above. This is
  # the aggregate Job's emptyDir; the root filesystem is read-only, so a
  # spill directory anywhere else would fail the build at open. Declared
  # rather than left to $TMPDIR so that the mounted volume the spill lands on
  # is visible in the deployed configuration.
  LOLSTATS_AGG_DUCKDB_TEMP_DIR: "/tmp"
  # DuckDB's own default here is "90% of available disk space", which on this
  # node is the whole disk shared with every other workload.
  LOLSTATS_AGG_DUCKDB_MAX_TEMP_SIZE: "10GiB"
  # The input gate refuses to publish when a participant row has neither a
  # champion nor a role, because such a row silently lowers every rate it
  # should have contributed to. The live archive is not perfectly clean: Riot
  # reports one participant per remake with teamPosition "" and
  # individualPosition "Invalid" (its literal sentinel), and the build would
  # otherwise refuse every night. This is the floor of the allowance; the
  # rate below scales it with the window.
  # Measured over 2026-09-04..2026-09-17 EUW/420, 30 rejected rows of 141,150
  # participant rows (0.021%); earlier windows of the same window measured
  # 0.018% (23/124,530), 0.018% (22/123,860) and 0.019% (20/105,980), so the
  # count moves with the archive while the rate does not. The 25 sits above
  # the smallest window the project has published so the floor alone covers a
  # quiet night.
  # A genuine classification regression rejects a large fraction of the
  # archive, not a handful of rows, and still stops the build: the allowance
  # is capped well under a tenth of a percent of the window.
  # The excluded rows are never assigned a guessed role; every run logs
  # rejected_rows and the effective allowance.
  LOLSTATS_AGG_MAX_REJECTED_ROWS: "25"
  # The absolute floor above goes stale as the archive grows: the nightly
  # window nearly tripled between 2026-09-04 (105,980 participant rows) and
  # 2026-09-17 (141,150), and 30 rejected rows then tripped a 25-row allowance
  # and quarantined build run 17. The allowance is therefore
  # max(floor, ceil(rate * participant_rows)). 0.0008 is 3.8x the worst rate
  # measured above (0.021%) and still under a tenth of a percent of any
  # window, so it absorbs remakes - about 1% of matches - without absorbing a
  # defect. At 141,150 rows it allows 113; at the 27,790-row two-patch window
  # the rate ceiling is 23, so the floor still decides (25). Zero switches the
  # rate off and leaves the floor exactly as it was, which is the fail-closed
  # posture.
  LOLSTATS_AGG_MAX_REJECTED_RATE: "0.0008"

  # The publish gate refuses to replace the live artifact when most of the
  # window's computable champion/role cells fall below min_cell_n. A real
  # window always has a long tail of one-off pairs (a champion played once in
  # an off-role), so the share above the floor tracks how deeply the patch the
  # window ends on has been crawled rather than whether the pipeline is
  # healthy. Measured over EUW/420 at min_cell_n=100: 19.3% of cells at 34,780
  # classified rows (2026-09-04..09-17), 12.1% at 21,620 (the last four days
  # alone) and 2.1% at 8,770 (patch 16.17 pinned) - the crawler's recent days
  # are denser than its older ones, so the share rises as a patch fills up.
  # 0.15 publishes the tier list the archive can support today while still
  # stopping a build whose window is materially thinner than the last one.
  # RAISE THIS toward the 0.5 default as the archive matures; the run logs
  # published/suppressed cells and the rows the published cells hold, so the
  # measurement is one log line away.
  LOLSTATS_AGG_MIN_CONFIDENT_SHARE: "0.15"

  # The crawl-freshness bound: the nightly build refuses to publish when the
  # newest match in the archive is older than this, and disables the check when
  # it is empty.
  #
  # It exists because a snapshot's generated_at is the time of the *build*, not
  # the age of the data behind it. An expired development key or a crawler that
  # will not start freezes the raw tree without changing it, so every later build
  # is a cheap success that republishes the same cells under a new timestamp and
  # the site swaps a dated snapshot for a freshly stamped copy of itself - which
  # reads as "the pipeline is alive". Measured: a build over the frozen archive
  # exits 1 with the age it measured and leaves the published tree untouched,
  # while a build one second after a real crawl publishes normally.
  #
  # 26h is one nightly cycle plus slack: scheduled every day at 01:00, the job
  # still runs after a normal day's crawling and refuses once the archive has
  # gone quiet. Nothing in the cluster can crawl with an expired key, so refusing
  # is the honest outcome - the alternative is publishing week-old matches under
  # tonight's date.
  #
  # A ConfigMap value rather than an argv flag on purpose. Manifests and images
  # reach this cluster from Git on independent schedules, so a flag can arrive
  # before the binary that defines it, and an unknown flag makes the nightly job
  # fail for a reason that has nothing to do with the data. An environment
  # variable degrades the other way: a binary that does not know it ignores it
  # and keeps publishing exactly as before, so the gate switches on with the
  # image that carries the check and never before.
  LOLSTATS_AGG_CRAWL_MAX_AGE: "26h"
