# Suspended on purpose: this is the manual repair tool, not part of the night.
# It re-processes a bounded key range from the raw archive, and running it on a
# schedule would mean re-fetching data that is already archived at a cost in Riot
# API budget for no new information.
#
# To use it, an operator creates a one-off job naming the keys to reprocess. The
# selection cannot be supplied by `--from=cronjob` alone - a job created that way
# carries only the `backfill` argument and exits 2 with a usage message, because
# the subcommand refuses to guess which slice of the archive to reprocess:
#
#   kubectl -n lolstats create job backfill-manual --from=cronjob/backfill \
#     --dry-run=client -o json \
#   | python3 -c 'import json,sys; j=json.load(sys.stdin); j["spec"]["template"]["spec"]["containers"][0]["args"] += ["-match-ids","EUW1_7944950978","-limit","1"]; json.dump(j,sys.stdout)' \
#   | kubectl create -f -
#
# One of `-match-ids a,b`, `-ids-file <path>` or `-puuid <uuid>` is required;
# `-from`/`-to` only bound the keys that are already selected, so a run with the
# window alone is rejected with the same usage message. Verified live: the bare
# instantiation exits 2, the form above completes with `candidates 1 known 1
# failed 0`. The manifest itself stays parameter-free so that the schedule can
# never run an unbounded backfill by accident.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backfill
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: backfill
spec:
  # A schedule is required by the API even when suspend is true. This one never
  # fires: the job is only ever started by hand.
  schedule: "0 4 * * 0"
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lolstats
            app.kubernetes.io/component: backfill
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # Same cold-start dial race as `maintain` (see that file for the
          # measurement): backfill opens postgres before it can resume, and
          # restartPolicy: Never means a retry is a fresh pod with a fresh
          # namespace, so a refused first dial is fatal rather than transient.
          initContainers:
            - name: wait-for-postgres
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              command:
                - sh
                - -c
                - |
                  set -eu
                  if [ -z "${LOLSTATS_POSTGRES_DSN:-}" ]; then
                      echo "wait-for-postgres: LOLSTATS_POSTGRES_DSN is empty" >&2
                      exit 1
                  fi
                  authority=${LOLSTATS_POSTGRES_DSN##*@}
                  authority=${authority%%/*}
                  host=${authority%%:*}
                  port=${authority##*:}
                  deadline=$(( $(date +%s) + 120 ))
                  until nc -z -w 2 "$host" "$port"; do
                      if [ "$(date +%s)" -ge "$deadline" ]; then
                          echo "wait-for-postgres: ${host}:${port} did not accept a connection" >&2
                          exit 1
                      fi
                      echo "wait-for-postgres: retrying ${host}:${port}"
                      sleep 1
                  done
                  echo "wait-for-postgres: ${host}:${port} is accepting connections"
              env:
                - name: LOLSTATS_POSTGRES_DSN
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-postgres
                      key: DSN
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          containers:
            - name: backfill
              # TODO(plan section 10, Phase 1): pin to a digest once a tag exists.
              image: ghcr.io/erik-schuetze/league-of-legends:latest
              command: ["/lolstats-ingest"]
              args: ["backfill"]
              envFrom:
                - configMapRef:
                    name: lolstats-config
              env:
                - name: GOMEMLIMIT
                  value: 1GiB
                - name: LOLSTATS_POSTGRES_DSN
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-postgres
                      key: DSN
                - name: LOLSTATS_RIOT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-riot
                      key: RIOT_API_KEY
                      # A backfill that only reprocesses the archive must work
                      # without a key; one that re-fetches needs it.
                      optional: true
                # A backfill is run by hand, which makes it the one place where a
                # person is watching: with the deadline recorded
                # (RIOT_API_KEY_EXPIRES_AT in the same Secret) the run stops with
                # "the Riot API key expired at ..." instead of reporting a page
                # of 401s as fetch failures. Optional, so nothing changes until
                # an operator records a deadline.
                - name: LOLSTATS_RIOT_API_KEY_EXPIRES_AT
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-riot
                      key: RIOT_API_KEY_EXPIRES_AT
                      optional: true
              resources:
                # Deliberately larger than the worker: a manual backfill is a
                # burst that someone is waiting on, and it is not running while
                # they sleep.
                requests:
                  cpu: 250m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: data
                  mountPath: /var/lib/lolstats
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: lolstats-data
            - name: tmp
              emptyDir: {}
