# Derives agg/v1/** from the raw archive. This is the job that reads the whole
# archive, so it gets the largest memory allocation in the stack and the lowest
# concurrency: one DuckDB pass over two years of payloads is a burst, and the
# node it lands on is an N100 shared with the rest of the homelab.
#
# 01:00, ahead of discover-seeds (02:10), static-sync (03:10) and site-build
# (03:40): the dependency between "aggregate finished" and "the site was built
# from it" is expressed as ordering in the night, not as a workflow engine,
# which is why activeDeadlineSeconds is bounded well below the next job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lolstats-aggregate
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: aggregate
spec:
  schedule: "* * * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Two hours: long enough for a full pass, short enough that an overrun
      # cannot still be running when the site build reads the tree at 03:40.
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lolstats
            app.kubernetes.io/component: aggregate
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # The aggregate job opens postgres once, for the build_runs row that
          # records the run, and does it before the DuckDB pass starts - so a
          # first dial refused while the pod network namespace is still warming
          # up fails the whole job. restartPolicy: Never forbids restarting the
          # container inside the already-warm namespace the retry would have
          # needed, so backoffLimit cannot recover it either: every retry is a
          # new pod with a new cold namespace. This gate waits for postgres
          # before the app starts, and is why the job needs the DSN at all - the
          # rest of its input is the raw archive.
          initContainers:
            - name: wait-for-postgres
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              command:
                - sh
                - -c
                - |
                  set -eu
                  if [ -z "${LOLSTATS_POSTGRES_DSN:-}" ]; then
                      echo "wait-for-postgres: LOLSTATS_POSTGRES_DSN is empty" >&2
                      exit 1
                  fi
                  authority=${LOLSTATS_POSTGRES_DSN##*@}
                  authority=${authority%%/*}
                  host=${authority%%:*}
                  port=${authority##*:}
                  deadline=$(( $(date +%s) + 120 ))
                  until nc -z -w 2 "$host" "$port"; do
                      if [ "$(date +%s)" -ge "$deadline" ]; then
                          echo "wait-for-postgres: ${host}:${port} did not accept a connection" >&2
                          exit 1
                      fi
                      echo "wait-for-postgres: retrying ${host}:${port}"
                      sleep 1
                  done
                  echo "wait-for-postgres: ${host}:${port} is accepting connections"
              env:
                - name: LOLSTATS_POSTGRES_DSN
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-postgres
                      key: DSN
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          containers:
            - name: aggregate
              # TODO(plan section 10, Phase 1): pin to a digest once a tag exists.
              image: ghcr.io/erik-schuetze/league-of-legends:latest
              command: ["/lolstats-aggregate"]
              # `build` with its patch and bracket from LOLSTATS_AGG_PATCH and
              # LOLSTATS_AGG_BRACKET, so promoting a new patch is a ConfigMap
              # change and not a manifest change. The build's safety property -
              # LOLSTATS_AGG_CRAWL_MAX_AGE, the freshness bound that stops a
              # frozen archive being republished under tonight's timestamp - is a
              # ConfigMap value for the same reason and is documented there.
              #
              # No argv flag is spelled out on purpose. Manifests and images
              # reach this cluster from Git on independent schedules, so a flag
              # that only a new binary understands can arrive first and turn the
              # nightly job into an "unknown flag" failure that says nothing
              # about the data. The environment variable cannot do that: a binary
              # without the check ignores it and behaves exactly as it did
              # before, so the bound can only ever switch on together with the
              # code that implements it.
              args: ["build"]
              envFrom:
                - configMapRef:
                    name: lolstats-config
              env:
                - name: GOMEMLIMIT
                  value: 2GiB
                # The raw archive is the only *data* input, so this job holds no
                # Riot key and no network egress beyond DNS - but it does record
                # one row per build in the control plane's build_runs table, so
                # it needs the DSN the gate above waits on. Without it the pass
                # either fails at startup or publishes cells that no run row
                # accounts for.
                - name: LOLSTATS_POSTGRES_DSN
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-postgres
                      key: DSN
              resources:
                requests:
                  cpu: 250m
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 3Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                # DuckDB spills to /tmp when a pass does not fit in memory; that
                # is the one writable path it gets.
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: data
                  mountPath: /var/lib/lolstats
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: lolstats-data
            - name: tmp
              emptyDir: {}
