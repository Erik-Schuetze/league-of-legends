# Homelab overlay: the environment-specific facts only.
#
# Everything that describes *what* the service is lives in ../../base. What is
# here is what differs because this is the k3s cluster at erik-schuetze.dev:
# which StorageClass each volume lands on, and which node must not host these
# pods. ArgoCD points at this directory (see
# homecluster/argocd-apps/lolstats.yaml) - the base is not applied directly by
# anything.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lolstats

resources:
  - ../../base

# The tag is deliberately the same `latest` the base carries: nothing is
# published to GHCR yet. Once the first tag exists this is the single place to
# change it, and the change should be a digest rather than a tag -
#   - name: ghcr.io/erik-schuetze/league-of-legends
#     newTag: v0.1.0
#     digest: sha256:...
# because a tag can be re-pushed while a digest cannot (plan section 5, R13).
# See deploy/README.md for the full TODO list; there is a matching TODO on each
# image reference in the base.
images:
  # One image, three binaries: /lolstats-ingest, /lolstats-aggregate and
  # /lolstats-web. The Go web tier (deploy/base/web/go-deployment.yaml) selects
  # the third with `command`, so this pin covers ingest and the jobs. The tier
  # itself is pinned by digest in the `replacements` block below instead, and
  # that block is where its pin is bumped.
  - name: ghcr.io/erik-schuetze/league-of-legends
    newTag: latest

replacements:
  # The Go tier's image is pinned by digest, not by tag, for a reason that
  # showed up on the first deploy: `latest` on this cluster already named a build
  # from before the tier was written, a node that has a tag cached does not
  # re-resolve it, and a Deployment whose spec does not change is not rolled out
  # when the tag moves - so the pods restarted into a crash loop on a binary
  # (/lolstats-web) that image did not contain, and stayed there. A digest is
  # immutable, is a diff ArgoCD can see, and is the same fact in the manifest as
  # in the cluster. The value comes from the annotated field in
  # deploy/base/web/go-deployment.yaml rather than from this file, because the
  # base describes *what* the tier is and only the pin is environment-specific.
  #
  # A replacement is used rather than a patch because the `images` transformer
  # above matches every workload that names the shared repository - the ingest
  # Deployment, the Go tier and all four scheduled jobs - and this must move the
  # Go tier's own container to a digest while leaving the tag on the rest. A
  # replacement runs after the image transformers, so the digest survives.
  #
  # sha-8739aa8 is the published image tag for the tier's first green CI run;
  # bump the annotation when the tier changes.
  - source:
      group: apps
      version: v1
      kind: Deployment
      name: lolstats-go-web
      fieldPath: metadata.annotations.[lolstats.dev/pinned-image]
    targets:
      - select:
          group: apps
          version: v1
          kind: Deployment
          name: lolstats-go-web
        fieldPaths:
          - spec.template.spec.containers.[name=web].image

patches:
  # Tier 2 (ZFS-backed NFS) for the raw archive and the published aggregates:
  # ReadWriteMany, because the worker, several jobs and two web replicas all
  # mount it, and the bytes are large and cold. The `site/` tree the deleted
  # static tier rendered into is no longer written; `raw/` and `agg/` are what
  # this volume is for now. See homecluster/docs/architecture.md section 3.
  - target:
      kind: PersistentVolumeClaim
      name: lolstats-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: nfs-client

  # Tier 1 (replicated local NVMe) for Postgres, which is the opposite kind of
  # workload: small, hot, latency-sensitive, and single-writer. Longhorn rather
  # than the NFS tier for the same file-locking reason the go-get-a-job PVC
  # documents.
  - target:
      kind: PersistentVolumeClaim
      name: lolstats-postgres-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: longhorn
      # Cluster convention for anything that has to survive a single N100
      # dying (see homecluster/postgres/pvc.yaml).
      - op: add
        path: /metadata/annotations/longhorn.io~1replica-count
        value: "2"

  # `vega` is the GPU node. Its `gpu` taint is not enough on its own: the
  # longhorn replica labels already keep data off it, but a pod that lands there
  # competes with GPU work for a small OS drive, and the node has a history of
  # going NotReady. Excluding it explicitly on every workload means placement is
  # a property of this file rather than of the node's current taints, which
  # Ansible or a kubelet restart can change without anyone noticing. bee01-03
  # remain unconstrained, so this does not pin pods to a particular host.
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/name=lolstats
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - vega
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      labelSelector: app.kubernetes.io/name=lolstats
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - vega
  - target:
      group: batch
      version: v1
      kind: CronJob
      labelSelector: app.kubernetes.io/name=lolstats
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - vega
  # Same rule for the PreSync migration hook. It needs its own entry because it
  # is a plain Job, and nothing in the tree above patches that kind. This also
  # means the `vega` exclusion in the base stays absent, where it belongs: the
  # node name is a fact about this cluster, not about the service.
  - target:
      group: batch
      version: v1
      kind: Job
      labelSelector: app.kubernetes.io/name=lolstats
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - vega
