# The server-rendered web tier: every page the site serves, assembled per request
# from the published aggregate snapshot.
#
# This is the public tier. The static tier it was staged beside was retired on
# 2026-09-17 (plan.md D-9): the owner ruled that the artifact was not worth
# keeping, and `lolstats-web` selects this Deployment, so there is no second copy
# to compare against and no parity gate left to clear. `go-service.yaml` stays as
# this tier's own Service for in-cluster probes.
#
# Two replicas: this is the only component with a public URL, and a rolling
# restart of one leaves the other answering. maxUnavailable 0 keeps that true
# during a rollout; /readyz is a real data check, so a pod that cannot read the
# snapshot is held out of the Service instead of taking half the traffic and
# answering 503.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolstats-go-web
  annotations:
    # The image this tier is pinned to, consumed by the overlay's `replacements`
    # block: the deployment tree pins one repository for three binaries, and
    # kustomize's `images` transformer therefore cannot pin this one alone.
    #
    # Each `sha-<short>` in this comment names a published image tag, not a
    # commit you can still look up here: the history was rewritten on 2026-09-18
    # to correct an author identity, so those revisions are no longer reachable
    # from this repository. The tag is what these lines identify, and it is what
    # the image below was built under.
    # sha-5e08b23: the revision that opens the explorer on 50 rows instead of 100, so
    #   the default /explore document fits the 300 KiB page-quality budget.
    #   - measured before this change, with an exhaustive instrument rather than a
    #     markup enumeration, the default /explore request was 1,281 B OVER the
    #     307,200 B ceiling: 141,790 (document) + 10,645 (the _astro base CSS that
    #     carries all six @font-face targets) + 1,755 (preload-helper module) + 157
    #     (TableIsland module) + 334 (favicon.svg) + 153,800 (six woff2 faces) =
    #     308,481 B = 301.25 KiB. This is the complete `resourceSize` sum and it
    #     reproduces the perf lane's independently measured 308,481 B exactly.
    #   - the 1,755 B term is /_astro/preload-helper.DJSjwBkS.js, which is
    #     DYNAMICALLY imported and therefore appears in no href/src attribute. An
    #     enumeration driven by the document's markup misses it and sums 306,726 B,
    #     i.e. 474 B under the ceiling - which is how this defect read as a pass.
    #     Rule: enumerate subresources from the browser's own request list.
    #   - the field matters: `transferSize` for the same page is 178,559 B, so
    #     reading the compressed field would report a 128,641 B margin on a page
    #     that is over budget. The ceiling is a source-byte budget; read
    #     `resourceSize`.
    #   - why 50 and not 25: explorePerOptions is BOTH the GUI "Rows per page" list
    #     and the URL allowlist (query.go MinPer/MaxPer), so the default must be a
    #     member - only 25 and 50 comply - and both terms of the sum grow, with the
    #     row term growing with the published dataset (900.9 B/row over 51,695 B of
    #     chrome: 25 -> 240,910; 50 -> 263,504; 100 -> 308,481; 200 -> 398,705).
    #     50 leaves 14.2% headroom where 100 had none.
    #   - the exports are structurally untouched: ExploreExportJSON and
    #     ExploreExportCSV read only .Patch from ParseQuery and never consume .Per,
    #     so the window cannot move a published export byte.
    #   - measured after: the default document is 96,813 B at ?per=50, and 74,219 B
    #     at ?per=25. No route, indexability or data changes.
    # sha-11866c4: the revision that stops quoting the partition's withheld count as
    #   a matchup count.
    #   - every matchup page printed the document's `suppressed_cells` as `(513
    #     withheld in total)` beside sentences about matchup PAIRS. That number is
    #     not a count of pairs: internal/aggregate/assemble.go builds the envelope
    #     once per partition from the tier-list cell build (SuppressedCells:
    #     s.cells.Suppressed) and internal/aggregate/artifacts.go reuses it for
    #     every role, so all five roles carry one value. The published tree proves
    #     it - measured on the edge 2026-09-18, the five documents at
    #     /agg/v1/p/16.18/EUW/420/all/matchups/{top,jungle,mid,bottom,support}.json
    #     report cells 1/0/1/31/8 and champions 170/135/164/144/160, with
    #     `suppressed_cells 513` identical on all five and `min_cell_n 100` on all
    #     five, while the tier-list partition that shares the number is a different
    #     artifact with `cells 260`.
    #   - the four publishing roles count pairing universes of 28,900 / 26,896 /
    #     20,736 / 25,600 and jungle counts none. Five different universes cannot
    #     share one withheld total, which is the arithmetic that settles it.
    #   - the five served sentences, measured on the edge against the build of
    #     sha-ea03221, each carrying the same parenthetical: top "*2 of 28,900
    #     pairings are published for this role. ... read as a dash here, never as
    #     zero (513 withheld in total). Only the 2 champions ...*"; mid `2 of
    #     26,896` / `2 champions`; bottom `62 of 20,736` / `10 champions`; support
    #     `16 of 25,600` / `7 champions`; and jungle "*stores no pairing for this
    #     role: every pair it counted was withheld below n = 100 games (513
    #     withheld in total), so no pair is shown rather than an estimate.*"
    #   - `suppressedClause()` is deleted. `matchupEmpty` now reports only what the
    #     role's own document holds: no stored cell, exactly one stored cell below
    #     its floor, or N stored cells all below it - then, when the document names
    #     a non-empty champion pool, "N champions appear in the pairings it
    #     counted" (135 for jungle, which is the lane-is-running signal the old text
    #     hid). The nil-artifact fallback is now "publishes no pairing for this role
    #     at or above n = N games", a fact about publication rather than a claim
    #     about a file. The matrix `Note` drops the withheld clause and keeps the
    #     dash-never-zero sentence; the tier-list sample-size notice still carries
    #     the count, as docs/contracts.md:442 requires of that component.
    #   - this is the fourth instance of one class in this repo: a shipped claim
    #     about the system that the system contradicts - the `38996d4` "published as
    #     static pages" copy on a dynamic tier, the `sha-9f23333` robots.txt that
    #     hardcoded its own state, and the `sha-ea03221` jungle sentence that denied
    #     an artifact it could have read.
    #   - **no route, indexability or data changes.** jungle's document moves
    #     33,923 -> 33,997 B, a sentence replaced rather than appended. The other
    #     four roles' bytes move only with the data. Both empty-state shapes stay
    #     bounded at 33,060 B / 33,012 B against the 150,000 B ceiling.
    #
    # sha-ea03221: the revision that describes an empty matchup role by the cells
    #   it holds, rather than by an artifact it claims does not exist.
    #   - /matchups/jungle told the reader "has no matchup artifact for this role,
    #     so no pair is shown rather than an estimate." Measured on the edge
    #     against the build of sha-88a53f0: that sentence is served, HTTP 200,
    #     33,923 B, 0 data-search rows - and the artifact it denies returns 200
    #     with cells=0, suppressed_cells=513, champions=135, min_cell_n=100. The
    #     pairing was stored and every pair it counted was withheld below the
    #     floor, which is a different fact and the one the page owed the reader.
    #   - the same denial was owed wherever a role held no published cell. Five
    #     roles measured on the edge at sha-88a53f0: mid 49,870 B, bottom 68,840,
    #     support 56,595, top 50,257, jungle 33,923 - and jungle alone served the
    #     false sentence. matchups.go now branches on what the artifact stores:
    #     one cell, more than one, suppressed > 0, or none withheld at all. The
    #     sentence survives only for a genuinely absent artifact (matchups==nil).
    #   - view_matchups_test.go holds both new shapes and the no-frame property at
    #     33,060 B / 33,012 B against the 150,000 B ceiling. **No route,
    #     indexability or data changes; current_contract prints one more value.**
    #
    # sha-4afb043: the revision that scopes the explorer's own numbers to the view
    #   that states them.
    #   - two sentences on /explore claimed figures the artifact does not support.
    #     "Sample: n = ... games in <role>" counted every published cell while the
    #     table rendered only that role's, so each role view attributed the whole
    #     snapshot's games to itself; and the producer's withheld count was
    #     appended to the floor sentence whenever a floor was printed, so a reader
    #     who raised the floor, or narrowed to one role, read a count that was
    #     never taken in that scope. Measured on the edge against the build of
    #     sha-75ef944: /explore renders `513 further cells were withheld for being
    #     below the threshold.` three times, and the sentence is identical on the
    #     unfiltered view and on a role-narrowed one.
    #   - the sample is now counted over the rows the view actually renders, and
    #     the withheld count is stated snapshot-wide only, where it is true.
    #     view_explore_test.go asserts both, and fails on the previous revision
    #     with three messages naming the wrong scope. Page size moves with the
    #     sentences; **no route, indexability or data changes**.
    #
    # sha-75ef944: the revision that makes every URL the site advertises one shape.
    #   - the site named its URLs two ways while serving them: rel=canonical,
    #     og:url and the structured-data url node carried the trailing-slash form,
    #     while /sitemap.xml's <loc> entries carried the bare path. Measured on
    #     the edge against the build of sha-5c626df: /tier-list/top's canonical
    #     reads `https://lol.erik-schuetze.dev/tier-list/top/` while its <loc> read
    #     `https://lol.erik-schuetze.dev/tier-list/top`, and /explore differs the
    #     same way. So every one of the sitemap's entries advertised a URL that is
    #     not the canonical of the page it points at, which leaves a crawler no way
    #     to tell which of the two to keep. The before-state, measured there:
    #     /sitemap.xml 71,375 B with 454 <loc> entries, every one the bare shape.
    #   - CanonicalPath() in render.go is now the single builder for both sides —
    #     the page metadata and the sitemap — so they cannot disagree about the
    #     shape of a URL again. The trailing-slash form is the one that has never
    #     sat behind a redirect.
    #   - sitemap_invariant_test.go asserts the two agree per route, in addition to
    #     its existing `in_sitemap == page_is_indexable` assertion in both
    #     directions. **No route, and no page's indexability, changes** — this moves
    #     URLs the site advertises onto the URLs it already serves.
    #
    # sha-5c626df: the revision that makes the sitemap advertise exactly the
    # routes whose pages ask to be indexed, and nothing else.
    #   - /sitemap.xml enumerated its routes from the manifest alone while the
    #     page builders decided indexability per page, so the two disagreed in
    #     both directions on the live edge: /champions/ahri/top renders
    #     `noindex,follow` and was advertised (1 <loc>), and /explore renders
    #     `index,follow` and was in none of the 1058 entries. routeList now
    #     filters champion and role routes through the same predicate the page
    #     builders use and appends /explore; sitemap_invariant_test.go asserts
    #     `in_sitemap == page_is_indexable` in both directions over every route
    #     the tier can serve, and fails with 1707 violations against the old
    #     routeList. **No page's rendered robots meta changes** - this moves the
    #     advertisement, not the product.
    # sha-3886631: the revision that bounds the matchup matrix, and the largest
    # page-size change this tier has served.
    #   - /matchups/<role> no longer renders the whole N x N matrix: the grid is
    #     a window of the champions the artifact's cells name, 12 x 12 = 144
    #     cells with the rows carried a page at a time, ?q= still carries one
    #     champion's complete row across the role's whole column axis, and the
    #     note under the grid discloses what the page left out.
    #   - /matchups/mid served 2,768,758 B of HTML and /matchups/bottom
    #     2,100,737 B, against the plan's 150 KB ceiling (plan section 7.4);
    #     /matchups/top served 33,881 B only because its artifact stores no
    #     cell to name an axis from. The bounds are sized from measured bytes -
    #     224 B for a published cell, 99 B for a dash, 53,015 B of live chrome
    #     on the heaviest route - so the default view is at most 88 KB and a
    #     filter's 276 cells at most 120 KB.
    #   - internal/webtier/view_matchups_test.go is new: it measures the served
    #     bytes of every query shape the route answers, which is the assertion
    #     whose absence let a 2.7 MB page pass the gate.
    # sha-f69d654: the revision that makes the crawler-facing copy honest and the
    # /about champion count legible, on top of the frozen-CSS strip.
    #   - /robots.txt no longer asserts "static" and "live" in literals; it
    #     derives its state word, source, window and preview sentence from the
    #     manifest it is serving (5c49ab0).
    #   - /about reads "235 across 173 champions" rather than "173champions"
    #     (f69d654).
    #   - the frozen inline layer is 6,777 B rather than 14 KB (5ba2bc5), which
    #     is most of the page-size change between this pin and the last one.
    # The digest before sha-3886631 (sha-9f23333) served literal "static"/"live"
    # words in robots.txt, which is a false statement on a server-rendered tier
    # under any posture - the reader that cannot notice is the one reading it.
    #
    # A digest bump is not a data-posture change (see env below): the image is the
    # same tree whatever this Deployment declares the posture to be, so the two
    # lines move independently.
    lolstats.dev/pinned-image: ghcr.io/erik-schuetze/league-of-legends@sha256:69cba3bb6e5cbb326d38b62a59028ed2e4f37007a98c46abc79abe63a6241dd6
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: web-go
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lolstats
      app.kubernetes.io/component: web-go
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lolstats
        app.kubernetes.io/component: web-go
    spec:
      # Longer than the process's 15s shutdown grace (cmd/lolstats-web), so the
      # listener drains and finishes the responses in flight rather than being
      # killed mid-write.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # The distroless `nonroot` uid the image declares, same as the ingest
        # worker: the volume is mounted read-only and every file in it is
        # world-readable, so this needs no ownership of anything.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # The same image as the rest of the stack; this binary differs only in
          # where `command` points. Pin is in overlays/homelab/kustomization.yaml.
          image: ghcr.io/erik-schuetze/league-of-legends:latest
          # The image's ENTRYPOINT is /lolstats-ingest, so the tier is chosen
          # here. An explicit absolute path, not a subcommand: this binary has
          # none, and a typo is a start-up failure rather than a worker that
          # quietly crawls instead of serving.
          command: ["/lolstats-web"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            # LOLSTATS_AGG_ROOT, LOLSTATS_SITE_URL and LOLSTATS_METRICS_ADDR
            # come from here. LOLSTATS_AGG_FIXTURES does too, but the container
            # declares it again in `env` below: deploy/base/config.yaml is
            # shared with the ingest tier, and the value that decides what the
            # public tier serves must not move when another lane moves that one.
            - configMapRef:
                name: lolstats-config
          env:
            # ------------------------------------------------------------------
            # PUBLISHED DATA, BY OWNER DECISION. The value below is the whole
            # data posture of this Deployment in one line, and it is set
            # explicitly rather than inherited from the ConfigMap above so that
            # it cannot change as a side effect of the shared switch moving.
            #
            # `off` renders LOLSTATS_AGG_ROOT - the published snapshot - and
            # never substitutes fixtures. A root with no manifest is a loud 503
            # on the ladder routes, which is the honest answer, not a reason to
            # fall back to demo data.
            #
            # The opposite value was the rule until 2026-09-17. It was gated on
            # §15 question 6 - whether serving real aggregates was acceptable
            # before Riot approved the production key - and the owner has
            # answered it in favour of publishing, waiving the compliance
            # workstream (docs/decisions, commit b262dcd). Nothing technical
            # changed: an agg/v1 tree on the PVC has been renderable since the
            # pipeline first ran, and `only` was ignoring it.
            #
            # NEVER set this to "only" or "auto":
            #
            #   "only" renders the checked-in demo tree under a PREVIEW banner.
            #          That is a labelled lie in front of the public URL now
            #          that real match statistics are what this tier exists to
            #          serve.
            #   "auto" is the same hazard one step removed: it falls back to
            #          the fixtures whenever the agg root is missing or is not
            #          explicitly configured, and the root arrives from the
            #          shared ConfigMap, which another lane may move.
            #
            # TestDeployedPostureRendersRealData (internal/webtier) resolves
            # this entry through the tier's own root selection and fails if the
            # demo tree can be reached - including for a value the tier would
            # silently normalise to "auto".
            # ------------------------------------------------------------------
            - name: LOLSTATS_AGG_FIXTURES
              value: "off"
            - name: LOLSTATS_WEB_ADDR
              value: ":8080"
            # Where the demo tree is inside this image (the Dockerfile copies
            # it to this path). Named explicitly rather than discovered: the
            # discovery walk up from the working directory is a development
            # convenience, and in a container it would be a guess about the cwd.
            #
            # A missing directory here is a startup warning and a 503 on the
            # ladder pages, never a table with missing rows. The Data Dragon
            # projection the champion pages name items, runes and spells from
            # needs no path: it is embedded in the binary
            # (internal/webtier/data.go), with a test that fails if the copy in
            # web/src/data ever drifts from it.
            - name: LOLSTATS_FIXTURES_DIR
              value: /web/src/fixtures
            # Under the 384Mi limit below with room for the runtime and the
            # per-request page buffers, which are not heap the limit measures.
            # The file cache has its own bound (64MiB, internal/webtier/artifacts.go).
            - name: GOMEMLIMIT
              value: 224MiB
          resources:
            # Rendering is CPU-bound and bursty, and the process keeps only the
            # snapshot's newest partitions resident, so the reservation is small
            # relative to the limit. This is the smallest allocation in the
            # stack.
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            # PodSecurity `restricted` in full: no privilege escalation, every
            # capability dropped, no writable root filesystem. The tier writes
            # nothing anywhere - it has no state, no cache directory and no
            # temp files - so a write attempt failing is the correct outcome and
            # is also what makes a path traversal in the artifact reader
            # useless.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/lolstats
              readOnly: true
            # The read-only root filesystem leaves no writable path at all, and
            # GOTRACEBACK-style diagnostics and any future temp file expect one.
            # An emptyDir here keeps that failure local instead of turning into
            # an unexplained crash under a read-only /.
            - name: tmp
              mountPath: /tmp
          # Readiness is the data check, not a liveness check with a different
          # name: /readyz answers 503 when the manifest advertises a newest
          # partition whose tierlist.json cannot be read, which is the failure
          # that takes the ladder pages down, so a pod in that state is kept out
          # of the Service while the other replica keeps serving. It answers 200
          # for a volume with no manifest at all, deliberately: the site pages
          # (/, /about, /legal/*) are real without a snapshot and a tier that
          # has never seen one is not failing - the ladder routes answer 503 per
          # request in that state (internal/webtier/server.go, /readyz).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness is about the process. It stays on /healthz deliberately: a
          # pod that has lost the volume can still serve the pages that do not
          # need it, and restarting it would not bring the artifact back.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          # The process compiles its templates at start-up and resolves the
          # snapshot before it listens, so the first seconds are busy and the
          # probe would otherwise race them.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lolstats-data
        - name: tmp
          emptyDir: {}
