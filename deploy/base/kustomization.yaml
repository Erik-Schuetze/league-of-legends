apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace is part of the frozen decisions, so it is fixed here rather than
# left to the overlay: an overlay that forgets it would silently deploy this
# stack into whatever namespace the ArgoCD Application happens to point at.
namespace: lolstats

resources:
  - namespace.yaml
  - config.yaml

  # The PreSync hook that puts the schema on the floor before any of the rest of
  # this is applied. It is listed first because it is the first thing that runs,
  # not because order matters to kustomize. See the file itself, and
  # deploy/README.md section Migrations.
  - jobs/migrate.yaml

  # The two volumes. The file archive is shared and lives on the overlay's RWX
  # storage class; Postgres gets its own block volume.
  - storage/pvc.yaml
  - postgres/pvc.yaml

  # The control plane: one StatefulSet, one Service, no external exposure.
  - postgres/statefulset.yaml
  - postgres/service.yaml

  # The long-running writer and the metrics Service the ServiceMonitor selects.
  - ingest/deployment.yaml
  - ingest/service.yaml

  # The public route: the ClusterIP Service the shared Caddy in namespace `web`
  # proxies to. It is kept although nothing backs it since 2026-09-18: the
  # retired web tier (docs/decisions/ADR-011) was its only workload, so a
  # request to the public name now has no endpoints behind it and the shared
  # Caddy answers 503. The Service stays because the name, the port and the
  # `component:` selector are the contract the Caddy upstream is already
  # written against, and re-adding a serving workload should be an edit to a
  # Deployment rather than to the cluster's proxy config. See the file.
  - web/service.yaml

  # Every scheduled unit of work, in the order they run during a night:
  # discover-seeds (00:10, before the build so the night's own discovery is in
  # it), aggregate (01:00), maintain (hourly), backfill (suspended, manual
  # only), backfill-timelines (weekly, Sunday 06:00). `static-sync` and
  # `site-build` used to sit at 03:10 and 03:40 and
  # were deleted on 2026-09-17 with the static tier; the Go tier that replaced
  # them was itself retired on 2026-09-18 (docs/decisions/ADR-011), so nothing
  # writes a site tree at all and the aggregate job's output is the end of the
  # pipeline.
  - jobs/aggregate.yaml
  - jobs/discover-seeds.yaml
  - jobs/maintain.yaml
  - jobs/backfill.yaml
  # The timeline lane's scheduled half: it enqueues `kind='timeline'` fetches for
  # a bounded sample of matches the control plane already holds, which the worker
  # then fetches as a second request per match. It is a separate CronJob from
  # `backfill` because it selects its own sample rather than replaying a key
  # range, and it is weekly rather than nightly because every run spends
  # rate-limit budget that the summary crawl also wants. The second half of the
  # lane - the dataset built from those payloads - is `lolstats-aggregate
  # features`, run by hand; nothing schedules it, so that a bad timeline extract
  # cannot fail the nightly tier list. See
  # docs/decisions/ADR-014-ingest-match-timelines.md.
  - jobs/backfill-timelines.yaml

  # ---- additions: operations workstream (backups) ----
  # Further scheduled work, but described separately because these units
  # protect the others rather than producing anything: the nightly logical
  # dump (04:30) and the restic snapshot of the raw archive (05:00). They run
  # after the window above has closed so that nothing is rewriting the files
  # they are reading. deploy/README.md, section Backups, is the reference.
  - backup/config.yaml
  - jobs/backup-postgres.yaml
  - jobs/backup-archive.yaml
  # ---- end additions: operations workstream (backups) ----

  # Default-deny first, then the exceptions, so the intent reads in one pass.
  - network/default-deny.yaml
  - network/allow.yaml

# The secrets are deliberately not referenced here: they are created out of band
# (see deploy/README.md) and only ever referenced by name, so that a real key
# cannot be committed to this repository by accident.
