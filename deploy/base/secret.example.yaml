# Template for the two Secrets the namespace needs. Copy it to
# deploy/base/secret.yaml, replace the placeholders, and apply that copy by
# hand:
#
#   cp deploy/base/secret.example.yaml deploy/base/secret.yaml
#   $EDITOR deploy/base/secret.yaml
#   kubectl apply -f deploy/base/secret.yaml
#
# The copy is ignored by deploy/.gitignore and is deliberately NOT part of the
# Kustomize build: a resource that every other workload depends on must not
# depend on a file that only exists on one operator's laptop, and a base that
# fails to render without it would break `kubectl kustomize` for everyone,
# including ArgoCD. ArgoCD therefore never manages these objects, and re-syncing
# the Application never overwrites or deletes them.
#
# Everything the workloads read from a Secret is listed here and nowhere else.
# Creating only the Riot Secret (or neither) is a supported state: the stack
# comes up and stays up without a Riot key - see deploy/README.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: lolstats-postgres
  namespace: lolstats
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  # Read by the postgres image at first start-up only. Changing POSTGRES_PASSWORD
  # here later does not change the role's password in an existing data
  # directory; at that point, rotate with ALTER ROLE and update DSN to match.
  POSTGRES_USER: lolstats
  POSTGRES_PASSWORD: REPLACE_ME_with_openssl_rand_hex_32
  POSTGRES_DB: lolstats

  # libpq/pgx connection string used by every Go workload (LOLSTATS_POSTGRES_DSN).
  # sslmode=disable is correct here and only here: the traffic stays inside the
  # cluster's pod network and the server does not offer TLS. Application name is
  # left to each binary so that pg_stat_activity shows which workload is talking.
  DSN: postgres://lolstats:REPLACE_ME_with_openssl_rand_hex_32@lolstats-postgres.lolstats.svc.cluster.local:5432/lolstats?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: lolstats-riot
  namespace: lolstats
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: ingest
type: Opaque
stringData:
  # A development key from https://developer.riotgames.com expires every 24h;
  # production keys are issued on request. Replace the whole value, do not quote
  # it. Rotation is a `kubectl apply` of this file plus a rollout restart of the
  # consumers:
  #
  #   kubectl -n lolstats rollout restart deployment/lolstats-ingest
  #
  # The key is referenced as an optional env var everywhere, so the manifests do
  # not care whether this Secret exists - only the worker and discover-seeds do,
  # and they report a clear error and wait when it is absent.
  RIOT_API_KEY: RGAPI-REPLACE_ME
