# Data Dragon versions, champions, items, runes and summoner spells. Daily, and
# before the site build, so that a new patch's static data is on disk before
# anything renders it. This job writes them into the RAW archive, under
# riot/ddragon/dt=<date>/kind=<kind>/; the aggregate run turns that into the
# agg/v1/static/<ddragon_version>/ tree the site build reads.
#
# STATUS (plan section 5.2, `static-sync`): the subcommand EXISTS and works. It is
# dispatched by cmd/lolstats-ingest (`runStaticSync`, internal/crawl/static.go) and
# was measured to exit 0, archiving 5 documents - versions, champions, items,
# runes and summoner-spells - in a single run. It reads the public Data Dragon CDN
# and needs no Riot API key.
#
# It is nonetheless suspended below, and NOT because it is broken. The shipped
# posture builds the site with LOLSTATS_AGG_FIXTURES=only, which renders the
# committed fixtures and ignores the volume, so this job's static tree would not
# be rendered. Arming it now would spend a nightly run on data nothing consumes.
# Removing the one `suspend: true` line is the whole change that turns it on, and
# it belongs with the move to real ingestion (AGG_FIXTURES=off).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: static-sync
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: static-sync
spec:
  # A schedule is required by the API even when suspend is true. This is the
  # schedule it will keep once the `static-sync` subcommand lands.
  schedule: "10 3 * * *"
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lolstats
            app.kubernetes.io/component: static-sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: static-sync
              # TODO(plan section 10, Phase 1): pin to a digest once a tag exists.
              image: ghcr.io/erik-schuetze/league-of-legends:latest
              command: ["/lolstats-ingest"]
              args: ["static-sync"]
              envFrom:
                - configMapRef:
                    name: lolstats-config
              env:
                - name: GOMEMLIMIT
                  value: 128MiB
                # Static data comes from Data Dragon over HTTPS, so this job is
                # the reason the egress rule for ddragon.leagueoflegends.com
                # exists. It needs no database.
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: data
                  mountPath: /var/lib/lolstats
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: lolstats-data
            - name: tmp
              emptyDir: {}
