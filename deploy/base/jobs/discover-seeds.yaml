# Refreshes the crawl frontier from the EUW ladders. It runs once a day because
# the input - who is currently ranked - changes on a human timescale, and because
# every extra run is a burst of Riot API calls spent on a frontier that is
# already wide enough.
#
# 00:10 is *before* the 01:00 aggregate build, which is the point. This job only
# enqueues keys; the long-running worker drains them into the raw archive that
# the 01:00 build reads. Until 2026-09-17 this ran at 02:10 - after the build -
# so a night's discovery could never appear in that night's snapshot: the newest
# payload behind a 01:00 build was always the previous night's discovery, a day
# old, and the frontier this job had just widened sat unused until the next
# night. Running first means whatever the worker fetches between 00:10 and 01:00
# is published an hour later instead of a day later, and the freshness bound the
# build enforces (LOLSTATS_AGG_CRAWL_MAX_AGE, 26h) now measures a crawl that is
# at most an hour idle rather than most of a day.
#
# The :10 offset keeps this run clear of `maintain` at :20 and of the jobs in the
# rest of the homelab that fire at :00, and 00:10 is outside the 03:10-05:00 block
# of the backup jobs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: discover-seeds
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: discover-seeds
spec:
  schedule: "10 0 * * *"
  # The plan's schedules are wall-clock times for a person reading the logs, not
  # UTC offsets; without this the job would drift by an hour twice a year.
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lolstats
            app.kubernetes.io/component: discover-seeds
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # Same cold-start dial race as `maintain` (see that file for the
          # measurement): discover-seeds opens postgres before it does anything
          # else, and restartPolicy: Never means a retry is a fresh pod with a
          # fresh namespace, so a refused first dial is fatal rather than
          # transient.
          initContainers:
            - name: wait-for-postgres
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              command:
                - sh
                - -c
                - |
                  set -eu
                  if [ -z "${LOLSTATS_POSTGRES_DSN:-}" ]; then
                      echo "wait-for-postgres: LOLSTATS_POSTGRES_DSN is empty" >&2
                      exit 1
                  fi
                  authority=${LOLSTATS_POSTGRES_DSN##*@}
                  authority=${authority%%/*}
                  host=${authority%%:*}
                  port=${authority##*:}
                  deadline=$(( $(date +%s) + 120 ))
                  until nc -z -w 2 "$host" "$port"; do
                      if [ "$(date +%s)" -ge "$deadline" ]; then
                          echo "wait-for-postgres: ${host}:${port} did not accept a connection" >&2
                          exit 1
                      fi
                      echo "wait-for-postgres: retrying ${host}:${port}"
                      sleep 1
                  done
                  echo "wait-for-postgres: ${host}:${port} is accepting connections"
              env:
                - name: LOLSTATS_POSTGRES_DSN
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-postgres
                      key: DSN
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          containers:
            - name: discover-seeds
              # TODO(plan section 10, Phase 1): pin `latest` to
              # v<semver>@sha256:<digest> once the release workflow has published
              # a tag, here and in the other jobs.
              image: ghcr.io/erik-schuetze/league-of-legends:latest
              command: ["/lolstats-ingest"]
              args: ["discover-seeds"]
              envFrom:
                - configMapRef:
                    name: lolstats-config
              env:
                - name: GOMEMLIMIT
                  value: 256MiB
                - name: LOLSTATS_POSTGRES_DSN
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-postgres
                      key: DSN
                - name: LOLSTATS_RIOT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-riot
                      key: RIOT_API_KEY
                      # Optional so a cluster with no Riot key still runs every
                      # job that does not need one, and so this job fails with
                      # its own clear message instead of a pod that never starts.
                      optional: true
                # The development key expires every 24 hours and only the
                # operator knows when; when they record it (RIOT_API_KEY_EXPIRES_AT
                # in the same Secret) this job refuses to start rather than
                # spend its Riot budget on a key that is already dead. Optional,
                # so an undeclared deadline changes nothing.
                - name: LOLSTATS_RIOT_API_KEY_EXPIRES_AT
                  valueFrom:
                    secretKeyRef:
                      name: lolstats-riot
                      key: RIOT_API_KEY_EXPIRES_AT
                      optional: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: data
                  mountPath: /var/lib/lolstats
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: lolstats-data
            - name: tmp
              emptyDir: {}
