# The server-rendered web tier: every page the site serves, assembled per request
# from the published aggregate snapshot.
#
# This is the public tier. The static tier it was staged beside was retired on
# 2026-09-17 (plan.md D-9): the owner ruled that the artifact was not worth
# keeping, and `lolstats-web` selects this Deployment, so there is no second copy
# to compare against and no parity gate left to clear. `go-service.yaml` stays as
# this tier's own Service for in-cluster probes.
#
# Two replicas: this is the only component with a public URL, and a rolling
# restart of one leaves the other answering. maxUnavailable 0 keeps that true
# during a rollout; /readyz is a real data check, so a pod that cannot read the
# snapshot is held out of the Service instead of taking half the traffic and
# answering 503.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolstats-go-web
  annotations:
    # The image this tier is pinned to, consumed by the overlay's `replacements`
    # block: the deployment tree pins one repository for three binaries, and
    # kustomize's `images` transformer therefore cannot pin this one alone.
    # sha-9f23333: the revision CI published for the cutover, and the first build
    # to reach `latest` afterwards. The `verify` job had been failing at
    # `actions/setup-node` on the deleted web/package.json, so every commit from
    # 1d670fe to 65f2983 published no image at all - which is why the pin that
    # preceded this one (sha-6333038) was still in place. That digest predates
    # 38996d4, so the live tier was serving copy that called the site "static
    # pages" and said its pages were "rendered at build time"; this digest
    # carries the corrected wording. The home page heading, its meta description,
    # the privacy description and the no-data sentence all state what the site
    # publishes rather than the mechanism that renders it (plan section 7.5), and
    # internal/webtier sweeps its own pages for that claim in every data posture,
    # so the pin is also the revision that makes the claim fail a test instead of
    # shipping.
    #
    # A digest bump is not a data-posture change (see env below): the image is the
    # same tree whatever this Deployment declares the posture to be, so the two
    # lines move independently.
    lolstats.dev/pinned-image: ghcr.io/erik-schuetze/league-of-legends@sha256:265923bd8da10fd0c033fc348654a5740d92d7d881c278efdd36a083812d148e
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: web-go
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lolstats
      app.kubernetes.io/component: web-go
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lolstats
        app.kubernetes.io/component: web-go
    spec:
      # Longer than the process's 15s shutdown grace (cmd/lolstats-web), so the
      # listener drains and finishes the responses in flight rather than being
      # killed mid-write.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # The distroless `nonroot` uid the image declares, same as the ingest
        # worker: the volume is mounted read-only and every file in it is
        # world-readable, so this needs no ownership of anything.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # The same image as the rest of the stack; this binary differs only in
          # where `command` points. Pin is in overlays/homelab/kustomization.yaml.
          image: ghcr.io/erik-schuetze/league-of-legends:latest
          # The image's ENTRYPOINT is /lolstats-ingest, so the tier is chosen
          # here. An explicit absolute path, not a subcommand: this binary has
          # none, and a typo is a start-up failure rather than a worker that
          # quietly crawls instead of serving.
          command: ["/lolstats-web"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            # LOLSTATS_AGG_ROOT, LOLSTATS_SITE_URL and LOLSTATS_METRICS_ADDR
            # come from here. LOLSTATS_AGG_FIXTURES does too, but the container
            # declares it again in `env` below: deploy/base/config.yaml is
            # shared with the ingest tier, and the value that decides what the
            # public tier serves must not move when another lane moves that one.
            - configMapRef:
                name: lolstats-config
          env:
            # ------------------------------------------------------------------
            # PUBLISHED DATA, BY OWNER DECISION. The value below is the whole
            # data posture of this Deployment in one line, and it is set
            # explicitly rather than inherited from the ConfigMap above so that
            # it cannot change as a side effect of the shared switch moving.
            #
            # `off` renders LOLSTATS_AGG_ROOT - the published snapshot - and
            # never substitutes fixtures. A root with no manifest is a loud 503
            # on the ladder routes, which is the honest answer, not a reason to
            # fall back to demo data.
            #
            # The opposite value was the rule until 2026-09-17. It was gated on
            # §15 question 6 - whether serving real aggregates was acceptable
            # before Riot approved the production key - and the owner has
            # answered it in favour of publishing, waiving the compliance
            # workstream (docs/decisions, commit b262dcd). Nothing technical
            # changed: an agg/v1 tree on the PVC has been renderable since the
            # pipeline first ran, and `only` was ignoring it.
            #
            # NEVER set this to "only" or "auto":
            #
            #   "only" renders the checked-in demo tree under a PREVIEW banner.
            #          That is a labelled lie in front of the public URL now
            #          that real match statistics are what this tier exists to
            #          serve.
            #   "auto" is the same hazard one step removed: it falls back to
            #          the fixtures whenever the agg root is missing or is not
            #          explicitly configured, and the root arrives from the
            #          shared ConfigMap, which another lane may move.
            #
            # TestDeployedPostureRendersRealData (internal/webtier) resolves
            # this entry through the tier's own root selection and fails if the
            # demo tree can be reached - including for a value the tier would
            # silently normalise to "auto".
            # ------------------------------------------------------------------
            - name: LOLSTATS_AGG_FIXTURES
              value: "off"
            - name: LOLSTATS_WEB_ADDR
              value: ":8080"
            # Where the demo tree is inside this image (the Dockerfile copies
            # it to this path). Named explicitly rather than discovered: the
            # discovery walk up from the working directory is a development
            # convenience, and in a container it would be a guess about the cwd.
            #
            # A missing directory here is a startup warning and a 503 on the
            # ladder pages, never a table with missing rows. The Data Dragon
            # projection the champion pages name items, runes and spells from
            # needs no path: it is embedded in the binary
            # (internal/webtier/data.go), with a test that fails if the copy in
            # web/src/data ever drifts from it.
            - name: LOLSTATS_FIXTURES_DIR
              value: /web/src/fixtures
            # Under the 384Mi limit below with room for the runtime and the
            # per-request page buffers, which are not heap the limit measures.
            # The file cache has its own bound (64MiB, internal/webtier/artifacts.go).
            - name: GOMEMLIMIT
              value: 224MiB
          resources:
            # Rendering is CPU-bound and bursty, and the process keeps only the
            # snapshot's newest partitions resident, so the reservation is small
            # relative to the limit. This is the smallest allocation in the
            # stack.
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            # PodSecurity `restricted` in full: no privilege escalation, every
            # capability dropped, no writable root filesystem. The tier writes
            # nothing anywhere - it has no state, no cache directory and no
            # temp files - so a write attempt failing is the correct outcome and
            # is also what makes a path traversal in the artifact reader
            # useless.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/lolstats
              readOnly: true
            # The read-only root filesystem leaves no writable path at all, and
            # GOTRACEBACK-style diagnostics and any future temp file expect one.
            # An emptyDir here keeps that failure local instead of turning into
            # an unexplained crash under a read-only /.
            - name: tmp
              mountPath: /tmp
          # Readiness is the data check, not a liveness check with a different
          # name: /readyz answers 503 when the manifest advertises a newest
          # partition whose tierlist.json cannot be read, which is the failure
          # that takes the ladder pages down, so a pod in that state is kept out
          # of the Service while the other replica keeps serving. It answers 200
          # for a volume with no manifest at all, deliberately: the site pages
          # (/, /about, /legal/*) are real without a snapshot and a tier that
          # has never seen one is not failing - the ladder routes answer 503 per
          # request in that state (internal/webtier/server.go, /readyz).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness is about the process. It stays on /healthz deliberately: a
          # pod that has lost the volume can still serve the pages that do not
          # need it, and restarting it would not bring the artifact back.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          # The process compiles its templates at start-up and resolves the
          # snapshot before it listens, so the first seconds are busy and the
          # probe would otherwise race them.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lolstats-data
        - name: tmp
          emptyDir: {}
