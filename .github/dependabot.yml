version: 2

updates:
  # Go module dependencies. This is the ecosystem most likely to produce an
  # advisory that affects this codebase, so it gets the most frequent check.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for routine bumps instead of a dozen. A security update still
      # opens on its own, because Dependabot bypasses groups for advisories.
      go-modules:
        patterns:
          - "*"

  # The Astro site. Separate from the Go modules because a frontend major
  # upgrade and a Go patch bump have nothing in common as review tasks.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(web)"
    groups:
      web:
        patterns:
          - "*"

  # There used to be one `docker` entry per published context here - /build/caddy
  # and /build/site - because Dependabot reads one Dockerfile per directory and
  # those two Dockerfiles pinned their base images by digest. Both directories
  # were deleted with the static tier on 2026-09-17 (plan.md D-9); the Go image's
  # own Dockerfile is covered by the root entry at the bottom of this file.

  # Actions in .github/workflows, which are pinned to full commit SHAs. This
  # is what keeps those pins from going stale, and it rewrites both the SHA
  # and the trailing "# vX.Y.Z" comment.
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images in the Dockerfile. All three stages are pinned by digest, and
  # this is what proposes the next one - which is the point of pinning: the bump
  # arrives as a reviewable diff instead of happening silently under a tag.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # The final stage is distroless; a major Debian bump changes the base
      # entirely and is worth doing deliberately rather than weekly.
      - dependency-name: "gcr.io/distroless/cc-debian12"
        update-types: ["version-update:semver-major"]
