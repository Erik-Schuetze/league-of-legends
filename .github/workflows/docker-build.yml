name: Build and push

# Publishes the one image this project runs (docs/contracts.md section 5): the
# Go binaries. Until 2026-09-17 this was a matrix of three - the Go image, the
# Node/Astro source the nightly site build rendered from, and Caddy with the
# cache-handler module (plan section 11, gate G0.5) - and the static tier was
# deleted outright rather than kept as a fallback (plan.md D-9), so the other two
# entries and their contexts went with it. The `verify` job gates the publish:
# nothing is published unless the Go and compliance checks pass.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  # So an image can be republished without a commit - after a failed tag push,
  # or to pick up a base-image or Go patch release that moved no file in this
  # repository. A manual run on main publishes sha-<short> and latest; it cannot
  # publish a semver tag, because those come from the git ref.
  workflow_dispatch:

# Least privilege for the whole workflow; only the job that pushes adds the
# one permission it needs on top of this.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # GHCR repository paths must be lowercase and the owner's GitHub login is not
  # (`Erik-Schuetze`), so the matrix spells the path out instead of deriving it
  # from github.repository. These have to match the image references in
  # deploy/base exactly.
  IMAGE_OWNER: erik-schuetze

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs. A tag such as @v4 is a mutable
      # ref that the action's owners, or anyone who compromises their account,
      # can repoint at new code that would then run here with this workflow's
      # token. The trailing comment records the release the SHA came from, and
      # .github/dependabot.yml keeps both in sync.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # No Node setup and no frontend build: the site is server-rendered by the
      # Go tier and the Astro tree that used to be built here was deleted on
      # 2026-09-18. The compliance gate scans pages a running tier served, which
      # `make compliance` captures itself over the checked-in fixtures.

      - name: fmt vet
        run: make fmt vet

      - name: Build
        run: make build

      - name: Test
        run: make test-race

      # The end-to-end analytics tests in internal/aggregate need the pinned
      # DuckDB CLI, and they skip themselves rather than fail when it is absent.
      # That is the right behaviour for a contributor without the client, but it
      # means the `Test` step above goes green on a runner that has no DuckDB
      # without ever running a single build against the fixture archive. This
      # step closes that hole: `make test-build` installs the pin (downloaded
      # from the release asset and verified against the same sha256 the
      # Dockerfile ships), exports LOLSTATS_DUCKDB_BIN at its absolute path, and
      # then fails if the hand-computed fixture build did not report PASS or if
      # anything in the package reported SKIP. The download failing, the version
      # not matching the pin, and a skip all fail the job.
      - name: Test the DuckDB aggregation path
        env:
          LOLSTATS_DUCKDB_BIN: ${{ github.workspace }}/bin/duckdb
        run: make test-build

      # The linter and govulncheck are pinned in the Makefile and invoked
      # through `go run`, so CI runs the same versions a contributor does.
      - name: Lint
        run: make lint

      - name: Vulnerability scan
        run: make vuln

      # The generated schema and declaration are committed, so a Go struct
      # change that was not regenerated shows up here as a diff rather than as a
      # consumer that reads a field the API does not emit.
      - name: Check generated types are current
        run: |
          make types
          git diff --exit-code -- schema

      # The serving contract of the deployed Go tier, exercised against a tier
      # started in the runner over the checked-in fixture artifact tree, and
      # again over a corrupt root to prove a missing agg/v1 is a 503 with a
      # visible page rather than a truncated 200. No cluster is involved.
      - name: Serving contract
        run: make verify-serving-local

      # The launch-blocking compliance gate, over the pages the tier itself
      # serves: the target captures that corpus (served-pages) and then scans it.
      # It had never run in CI, so the checks amended on 2026-09-17
      # (docs/compliance.md) could have been weakened without anything noticing.
      - name: Compliance gate
        run: make compliance

      # ...and the proof that the amendment is not a weakening: one planted
      # violation at a time, each of which the amended gate must still fail on,
      # plus a page with no <script> at all, which must pass.
      - name: Compliance negative controls
        run: make compliance-negative-control

      # The controls for the gates that could not fail: an origin that serves
      # the Data Dragon projection with no cache policy and a 404 under the
      # reserved prefix that a cache would keep (the serving gate must reject
      # both), docker hidden from PATH for real (make compliance-gnu must fail and
      # name the missing tool), and a live posture rendered from the checked-in
      # fixtures (the live-state half of check 11 must pass while naming the live
      # pages it scanned, and must fail on a live page stripped of its banner by
      # that page's real path). The corpus CI scans is all-demo, so the live half
      # of that scan is only exercised there. Every control fails closed when it
      # cannot create its condition.
      - name: Gate controls (fail closed)
        run: make gate-controls

      # The gate's scans hand a NUL-delimited list of paths to grep, and GNU
      # grep answers an empty list from its own standard input. This runner has
      # GNU userland and the author's machine does not, so the portability half
      # of that control runs here: the same script under Debian, with a
      # deliberately non-empty stdin. The target fails closed (require-docker)
      # when no usable container runtime is present, which the step above proves.
      - name: Compliance gate under GNU userland
        run: make compliance-gnu

  build-and-push:
    needs: verify
    # Nothing is published from a pull request; it runs the verify job and stops.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image, and the matrix stays rather than becoming a plain job: it is
      # what spells the registry path out (GHCR needs lowercase) and what the
      # publish steps below are written against as `matrix.*`.
      fail-fast: false
      matrix:
        include:
          - image: league-of-legends
            context: .
            dockerfile: Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag scheme is frozen in docs/contracts.md section 5. A release tag
      # publishes the semver name unchanged so a manifest can copy it, plus the
      # short SHA so the exact commit is always reachable.
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # The commit time, not the build time. Two builds of the same commit then
      # produce the same org.opencontainers.image.created label, so a label
      # diff is always a real change rather than a clock reading.
      - name: Read the commit timestamp
        id: commit
        run: echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # The cluster is amd64 only; building a second architecture would
          # double the build time to publish an image nothing can run.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.commit.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A package pushed with GITHUB_TOKEN starts out private, regardless of the
      # repository's own visibility, and the cluster pulls these anonymously -
      # there is no imagePullSecret anywhere in it, and the kubelet has no
      # credential to offer. Without this step the first ArgoCD sync produces
      # nothing but ImagePullBackOff on every pod, which is a confusing way to
      # discover a one-line API call. `packages: write`, already granted above,
      # is the permission this endpoint needs.
      #
      # It does not fail the job: the images are pushed at this point, and a
      # red run over a visibility change would report the wrong thing as broken.
      # The step is verified out of band instead, by pulling the image back with
      # no credentials at all (`docker pull` after a `docker logout ghcr.io`),
      # which is the only test that reflects what the kubelet will do.
      - name: Make the published package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${{ matrix.image }}" \
            -f visibility=public \
            && echo "package ${{ matrix.image }} is public" \
            || echo "::warning title=package visibility::could not set ${{ matrix.image }} to public; set it by hand in the package settings or grant the operator token write:packages"
