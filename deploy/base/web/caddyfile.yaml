# The Caddyfile for the lolstats web tier. This is NOT the cluster's shared
# Caddy: that one stays where it is and only gains a reverse_proxy to this
# Service (see homecluster/web/caddy/configmap.yaml). This tier is what makes the
# site and its aggregate artifacts one origin, so the browser needs no CORS
# exception and the shared proxy needs no route of its own for /agg.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lolstats-site-config
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: web
data:
  Caddyfile: |
    {
    	# cache-handler is a third-party directive with no default place in the
    	# standard order, so it has to be told where it belongs. Before rewrite
    	# means the cached decision is made on the original path, which is what
    	# /agg/* needs: without it the handler would see the path only after
    	# handle_path had already stripped the prefix.
    	order cache before rewrite

    	cache {
    		# Everything under /agg is republished nightly and the whole tree is
    		# replaced by directory rename, so a stale entry can only survive for
    		# a minute and a long TTL would buy nothing.
    		ttl 60s
    		allowed_http_verbs GET HEAD
    		default_cache_control public
    		# A workaround for a real bug in the pinned module, not a tuning knob.
    		# Keep it small and do not raise it without reading this first.
    		#
    		# The chain pinned in build/caddy/Dockerfile is
    		# caddyserver/cache-handler v0.16.0 -> storages/otter/caddy v0.0.18 ->
    		# storages/core v0.0.18 (otter's own go.mod lifts core above the v0.0.15
    		# that cache-handler asks for, so v0.0.18 is what gets linked). Core
    		# v0.0.18 replays a HIT with readResponse(), which reads the stored
    		# entity through a bufio.Reader over a *pooled* bytes.Buffer and returns
    		# that buffer to the pool in a defer, before the caller has read
    		# Response.Body. Everything past the reader's first 4096-byte fill is
    		# gone, so the entity that reaches the client is 4096 bytes minus the
    		# stored header block: a 35179-byte page is served as 200 OK with a
    		# 3790-byte body that stops mid-markup and has lost the mandatory
    		# "PREVIEW - illustrative data" banner. The reply's own Content-Length
    		# matches that short body, so nothing about the response looks wrong.
    		# The store path is not the problem - an upstream response whose body
    		# ends early is not cached at all - which is why this cap targets the
    		# replay. The upstream fix is in
    		# storages/core v0.0.19, which needs Caddy 2.11 and so is out of reach
    		# while the current pins hold; this cap is the fix that fits.
    		#
    		# 2048 is chosen against the 4096-byte fill: a 2048-byte body plus the
    		# ~320-byte header block file_server emits is ~2.4 KB of stored entity,
    		# so nothing the module may one day have to replay can be longer than a
    		# single buffer fill. Larger responses are forwarded uncached - the
    		# Cache-Status detail is UPSTREAM-RESPONSE-TOO-LARGE, the body is the
    		# file server's, and it is complete. Measured on the real image with the
    		# Caddyfile below: 40000-byte probe, 35179-byte page and 2049-byte probe
    		# all served whole on every request, a 2048-byte one still cached and
    		# still whole, and no size above the cap ever truncated.
    		# scripts/verify-serving.sh is the regression check; the defect was
    		# invisible to a single request because the miss path streams the real
    		# response and only the hit path was poisoned.
    		max_cacheable_body_bytes 2048
    		# In-memory storage: this pod serves files and can be replaced at any
    		# time, so a persistent cache would be a disk dependency with no
    		# benefit.
    		otter
    	}
    }

    # Port 8080, not 80: the container runs as an unprivileged uid and the
    # restricted pod security profile forbids the capability needed to bind a
    # port below 1024. The Service publishes it as 80.
    :8080 {
    	# brotli is deliberately absent. It is not in Caddy's standard module set
    	# (the official image ships gzip and zstd only), so `encode br` fails
    	# config adaptation at start-up with "module not registered:
    	# http.encoders.br" - a crash loop, not a warning. Adding it would mean
    	# one more third-party module pinned in build/caddy/Dockerfile for a few
    	# percent on a pre-rendered site that zstd already compresses well.
    	# Verified against the built image with `caddy validate`.
    	encode zstd gzip

    	# Responses over the cap above are forwarded uncached rather than stored,
    	# which is what keeps the pages complete; see the note in the global cache
    	# block before changing anything about this line.
    	cache

    	# Answered by the server, not by the file server, so the probes do not
    	# depend on whether anything has been published yet. A probe on / would
    	# read a 404 from an empty volume as a failure and hold both replicas out
    	# of the Service while the site has simply never been built.
    	handle /healthz {
    		respond "ok" 200
    	}

    	# The aggregate tree, served as-is. handle_path strips /agg so that the
    	# URL prefix and the on-disk layout stay independent.
    	handle_path /agg/* {
    		root * /var/lib/lolstats/agg
    		file_server
    	}

    	# The rendered site. try_files is what makes Astro's directory output work
    	# without a trailing slash on the request.
    	handle {
    		root * /var/lib/lolstats/site
    		try_files {path} {path}/ {path}/index.html
    		file_server
    	}

    	header {
    		-Server
    		X-Content-Type-Options nosniff
    	}

    	# Astro puts a content hash in the filename of every asset it emits under
    	# /_astro, so a URL there can only ever name one byte sequence: a rebuild
    	# that changes the file changes the name with it. That is what makes a
    	# year-long immutable policy correct here rather than reckless, and it is
    	# the one long TTL this tier can honestly promise - pages over the cache cap
    	# are never stored (see max_cacheable_body_bytes above), and /fonts is not
    	# content-hashed, so both keep the default `public` policy.
    	header /_astro/* {
    		Cache-Control "public, max-age=31536000, immutable"
    	}

    	log {
    		output stdout
    		format console
    	}
    }
