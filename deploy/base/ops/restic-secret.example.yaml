# Template for the `lolstats-restic` Secret: the repository password the
# `backup-archive` CronJob needs, plus (when one exists) the location and the
# credentials of a destination that is not on this cluster's own volume.
#
# Copy it, fill it in, apply that copy by hand:
#
#   cp deploy/base/ops/restic-secret.example.yaml deploy/base/ops/restic-secret.yaml
#   $EDITOR deploy/base/ops/restic-secret.yaml
#   kubectl apply -f deploy/base/ops/restic-secret.yaml
#
# The copy is ignored by deploy/.gitignore, exactly like deploy/base/secret.yaml,
# and is deliberately NOT part of the Kustomize build: nothing in the base may
# depend on a file that only exists on one machine. ArgoCD therefore never
# manages this object - which is also what makes changing the destination a
# `kubectl apply` that no sync can revert.
#
# The backup job references this Secret as `optional: true` in three places
# (RESTIC_PASSWORD, the rest of its keys as environment variables, and the
# volume at /etc/restic for an ssh key). A namespace without it therefore still
# starts every other workload; `backup-archive` alone fails, loudly, and that
# failure is the thing to alert on.
#
# RESTIC_PASSWORD is unrecoverable: restic derives the repository keys from it
# and there is no reset. Losing it makes every existing snapshot unreadable, so
# the value has to exist somewhere other than this cluster (a password manager,
# a printed copy in the safe) *before* the first backup runs. The first run of
# the job creates the repository; there is nothing else to initialise.
---
apiVersion: v1
kind: Secret
metadata:
  name: lolstats-restic
  namespace: lolstats
  labels:
    app.kubernetes.io/name: lolstats
    app.kubernetes.io/component: backup-archive
type: Opaque
stringData:
  # openssl rand -base64 32, no trailing newline. `tr -d '\n'` because a
  # trailing newline is part of the password if it gets into the value.
  RESTIC_PASSWORD: REPLACE_ME_with_openssl_rand_base64_32

  # ---------------------------------------------------------------------------
  # Everything below is optional, and every key here becomes an environment
  # variable in the backup job (that is how the job is written - see the header
  # of deploy/base/jobs/backup-archive.yaml). Uncomment one block to point the
  # snapshot at a destination that is not this cluster's volume. The default,
  # used when RESTIC_REPOSITORY_OVERRIDE is absent, is
  # /var/lib/lolstats/backups/restic - a path on the same NFS export as the
  # archive, which is *not* an off-site copy and leaves plan risk R6 open.
  #
  # Whichever block is chosen, an egress rule is also required: the namespace
  # denies all egress by default and only allows DNS, Riot over 443 and
  # in-namespace traffic, so a remote repository hangs instead of failing
  # usefully until deploy/base/network/allow.yaml selects
  # `app.kubernetes.io/component: backup-archive` on the port the destination
  # uses. docs/runbooks/restore-raw.md, section "When off-site media appears",
  # is the checklist that must be followed in order.
  # ---------------------------------------------------------------------------

  # --- Second machine over ssh, i.e. the 0 EUR/month option ---------------
  # The destination must be a *different* failure domain: a different machine,
  # ideally a different building. `restic init` creates the repository on the
  # first run, so the only preparation on the remote side is an account, a
  # directory it can write, and the public half of the key below in its
  # ~/.ssh/authorized_keys.
  #
  # RESTIC_REPOSITORY_OVERRIDE: "sftp:backup@second-machine:/srv/restic/lolstats"
  # RESTIC_EXTRA: "-o sftp.command=ssh -i /etc/restic/id_ed25519 -o UserKnownHostsFile=/etc/restic/known_hosts -o StrictHostKeyChecking=yes backup@second-machine"
  # id_ed25519: |
  #   -----BEGIN OPENSSH PRIVATE KEY-----
  #   ...
  #   -----END OPENSSH PRIVATE KEY-----
  # known_hosts: |
  #   second-machine ssh-ed25519 AAAA...

  # --- S3-compatible object storage --------------------------------------
  # Works with Cloudflare R2, Backblaze B2's S3 endpoint, MinIO, and Hetzner
  # Object Storage. R2's free tier (10 GB, no egress charge) is the only one of
  # those that keeps this project at 0 EUR/month, and it is far larger than the
  # archive needs: the first snapshot of 1.30 GiB of tree stored 189.6 MiB.
  #
  # RESTIC_REPOSITORY_OVERRIDE: "s3:https://<account-id>.r2.cloudflarestorage.com/lolstats-restic"
  # AWS_ACCESS_KEY_ID: REPLACE_ME
  # AWS_SECRET_ACCESS_KEY: REPLACE_ME
  # AWS_DEFAULT_REGION: auto

  # --- Backblaze B2's native API (not its S3 endpoint) -------------------
  # RESTIC_REPOSITORY_OVERRIDE: "b2:lolstats-restic:/"
  # B2_ACCOUNT_ID: REPLACE_ME
  # B2_ACCOUNT_KEY: REPLACE_ME
